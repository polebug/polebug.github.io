<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIKI | HOME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================= 核心重置与高级变量 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f9f9fb; /* 完美的浅色底色，带有一丝高级冷调，比纯白更有质感 */
            color: #111115;
            overflow-x: hidden;
            /* 丝滑入场动画 */
            animation: pageFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= 1. 统一高度的浅色毛玻璃导航栏 ================= */
        .vibe-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            height: 75px; /* 锁死高度，保持全站一致 */
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #111115;
        }

        .nav-links {
            display: flex;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(0, 0, 0, 0.45);
            margin-left: 35px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #111115;
        }

        /* ================= 2. 巨型排版 Hero 视觉区（深色渐变字） ================= */
        .home-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 5% 120px;
        }

        .home-hero {
            margin-bottom: 80px;
            position: relative;
        }

        /* 标题变为由深至浅的石墨色渐变，保留李泳知的视觉张力 */
        .hero-title {
            font-size: clamp(48px, 9.5vw, 95px);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -4px;
            margin-bottom: 40px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #111115 0%, #66666e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 16px;
            color: #55555a;
            max-width: 600px;
            line-height: 1.7;
            font-weight: 400;
        }

        /* ================= 3. 浅色高质感分流卡片 ================= */
        .home-portal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .portal-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 30px;
            min-height: 320px;
            border-radius: 28px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01);
        }

        /* 优化卡片配色，用微妙的色差营造法式极简 Ins 感 */
        .item-projects {
            background: #ffffff; /* 纯白纯净 */
        }
        /* 极其克制的浅蓝色微光，增加呼吸感 */
        .item-projects::after {
            content: ''; position: absolute; top: -50%; right: -50%; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(47, 90, 196, 0.06) 0%, transparent 70%);
        }

        .item-thoughts {
            background: #f4f4f7; /* 标志性的工业灰块 */
        }

        .item-about {
            background: #f0f3fa; /* 淡淡的藏蓝调灰色 */
        }
        /* 极其克制的浅紫色微光 */
        .item-about::after {
            content: ''; position: absolute; bottom: -50%; left: -50%; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.05) 0%, transparent 70%);
        }

        /* 浅色模式下的文字细节平衡 */
        .portal-num {
            font-size: 14px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.15);
            letter-spacing: 2px;
        }

        .portal-card h2 {
            font-size: 22px;
            font-weight: 600;
            color: #111115;
            line-height: 1.3;
        }

        .portal-card h2 span {
            display: block;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.4);
            text-transform: uppercase;
            margin-top: 8px;
            letter-spacing: 1px;
            font-weight: 400;
        }

        .portal-arrow {
            font-size: 24px;
            color: rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
            align-self: flex-end;
        }

        /* ================= 浅色悬浮动效 ================= */
        .portal-card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 0, 0, 0.12);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05); /* 柔和优雅的浅色投影 */
        }

        .portal-card:hover .portal-arrow {
            color: #111115;
            transform: translateX(5px);
        }

        /* ================= 汉堡菜单自适应 ================= */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }
        .menu-toggle .bar {
            width: 20px;
            height: 20px;
            border-bottom: 2px solid #111115;
            margin: 2px 0;
        }

        @media (max-width: 900px) {
            .home-portal-grid { grid-template-columns: 1fr; gap: 20px; }
            .portal-card { min-height: 240px; }
            .hero-title { letter-spacing: -2px; }
        }
    </style>
</head>
<body>

    <nav class="vibe-navbar">
        <div class="logo">WW.WIKI</div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="index.html" class="active">首页</a>
            <a href="projects.html">项目与洞察</a>
            <a href="thoughts.html">思考与生活</a>
            <a href="about.html">关于我</a>
        </div>
    </nav>

    <main class="home-container">
        
        <header class="home-hero">
            <h1 class="hero-title">RESEARCH.<br>THINK.<br>CREATE.</h1>
            <p class="hero-subtitle">探索移动出行与适老化市场的专业数据洞察，在喧嚣的世界里留下一处安静解构生活的数字花园。</p>
        </header>

        <section class="home-portal-grid">
            
            <a href="projects.html" class="portal-card item-projects">
                <div class="portal-num">// 01</div>
                <h2>项目与技术力<span>Portfolio & Insights</span></h2>
                <div class="portal-arrow">→</div>
            </a>

            <a href="thoughts.html" class="portal-card item-thoughts">
                <div class="portal-num">// 02</div>
                <h2>思考与生活<span>Thoughts & Diaries</span></h2>
                <div class="portal-arrow">→</div>
            </a>

            <a href="about.html" class="portal-card item-about">
                <div class="portal-num">// 03</div>
                <h2>关于我<span>Me, Myself & I</span></h2>
                <div class="portal-arrow">→</div>
            </a>
            
        </section>
    </main>

    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        if(mobileMenu) {
            mobileMenu.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
