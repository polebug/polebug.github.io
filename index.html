<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WW.WIKI | 首页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* 全局统一核心样式 */
        :root { --bg-color: #fafafc; --text-main: #111111; --text-muted: #666666; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px; color: var(--text-main); line-height: 1.6; overflow-x: hidden;
        }
        
        /* 统一导航栏样式 */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 5vw; background: rgba(250,250,252,0.8);
            backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); text-decoration: none; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a {
            text-decoration: none; color: var(--text-muted);
            font-size: 15px; font-weight: 600; transition: color 0.3s ease;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        
        /* 页面容器 */
        .container { max-width: 900px; margin: 0 auto; padding: 120px 20px; }
        
        /* 首页定制样式 */
        .hero-section { text-align: left; animation: fadeIn 1s ease-out; }
        .hero-tag { display: inline-block; padding: 6px 14px; background: #eee; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 30px; }
        .hero-title { font-size: 56px; font-weight: 800; line-height: 1.1; letter-spacing: -2px; margin-bottom: 30px; }
        .hero-subtitle { font-size: 20px; color: var(--text-muted); max-width: 650px; margin-bottom: 50px; line-height: 1.7; }
        
        .cta-group { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 16px 32px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; transition: all 0.3s ease; }
        .btn-primary { background: var(--text-main); color: #fff; border: 1px solid var(--text-main); }
        .btn-primary:hover { background: transparent; color: var(--text-main); transform: translateY(-3px); }
        .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid rgba(0,0,0,0.1); }
        .btn-secondary:hover { border-color: var(--text-main); transform: translateY(-3px); background: #fff;}

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .hero-title { font-size: 40px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">WW.WIKI</a>
        <div class="nav-links">
            <a href="index.html" class="active">首页</a>
            <a href="projects.html">项目与洞察</a>
            <a href="thoughts.html">思考与生活</a>
            <a href="about.html">关于我</a>
        </div>
    </nav>

    <main class="container">
        <section class="hero-section">
            <div class="hero-tag">Singapore Based 🇸🇬</div>
            <h1 class="hero-title">
                最敏锐的商业机会，<br>永远藏在用户的<br>原声数据里。
            </h1>
            <p class="hero-subtitle">
                你好，这里是 WW.WIKI。<br>
                我是一名前沿市场的研究者，专注于适老化市场 (Silver Economy)、移动出行与智能硬件。通过定性调研与社会化聆听，探寻商业增长与用户尊严的交汇点。
            </p>
            <div class="cta-group">
                <a href="projects.html" class="btn btn-primary">查看项目洞察</a>
                <a href="thoughts.html" class="btn btn-secondary">思考与生活</a>
                <a href="about.html" class="btn btn-secondary">关于我</a>
            </div>
        </section>
    </main>
</body>
</html>
