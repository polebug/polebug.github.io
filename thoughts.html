<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思考与生活 | WW.WIKI</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="vibe-navbar">
        <div class="logo">WW.WIKI</div>
        <div class="nav-links">
            <a href="/index.html">首页</a>
            <a href="/projects.html">项目与洞察</a>
            <a href="/thoughts.html" class="active">思考与生活</a>
            <a href="/about.html">关于我</a>
        </div>
    </nav>

    <audio id="global-audio"></audio>
    <div class="floating-audio-pill" id="global-player">
        <div class="visualizer" id="pill-visualizer"><span></span><span></span><span></span></div>
        <div class="pill-track-info"><div class="pill-track-name" id="pill-title">Not Playing</div></div>
        <button class="pill-btn" id="pill-play-btn">▶</button>
        <button class="pill-btn" id="pill-next-btn">⏭</button>
    </div>

    <main class="article-container" id="pjax-container">
        <h1>思考与生活</h1>
        <p>这里是你的思考记录。</p>
        <ul>
            <li><a href="/posts/vibe-coding.html">Vibe Coding初体验</a></li>
        </ul>
    </main>

    <script>
        // 1. 音乐播放逻辑
        const playlist = [{ title: 'PWLT', artist: 'Krystal', src: '/images/PWLT.mp3' }];
        let currentTrackIdx = 0; 
        const audio = document.getElementById('global-audio');

        function syncPlayerUI() {
            const isPlaying = !audio.paused;
            document.getElementById('pill-title').innerText = playlist[currentTrackIdx].title;
            document.getElementById('pill-play-btn').innerText = isPlaying ? '⏸' : '▶';
            document.getElementById('pill-visualizer').classList.toggle('playing', isPlaying);
        }

        function togglePlay() {
            if (audio.paused) { audio.play().catch(()=>{}); } else { audio.pause(); }
            syncPlayerUI();
        }

        document.getElementById('pill-play-btn').addEventListener('click', togglePlay);
        document.getElementById('pill-next-btn').addEventListener('click', () => { /* 循环逻辑 */ syncPlayerUI(); });

        // 2. 核心路由拦截与加载逻辑（带错误防御）
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link || !link.href || link.getAttribute('target') === '_blank') return;
            
            // 严防死守：如果是静态文件，坚决不拦截，让浏览器自己去加载 CSS/JS
            const isStaticAsset = /\.(css|js|png|jpg|ico|mp3|wav|xml|txt)$/.test(link.href);
            
            if (link.origin === window.location.origin && !isStaticAsset) {
                e.preventDefault();
                loadPage(link.href);
            }
        });

        async function loadPage(url) {
            document.body.style.cursor = 'wait';
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const container = doc.getElementById('pjax-container');
                
                if (container) {
                    document.getElementById('pjax-container').innerHTML = container.innerHTML;
                    document.title = doc.title;
                    history.pushState(null, null, url);
                    window.scrollTo(0, 0);
                    // 运行后置脚本，加 try 包裹防崩溃
                    try { reRunPageScripts(); } catch(e) {}
                } else {
                    window.location.href = url;
                }
            } catch (err) {
                window.location.href = url; // 失败直接强转
            } finally {
                document.body.style.cursor = 'default';
            }
        }

        function reRunPageScripts() {
            const path = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-links a').forEach(a => {
                a.classList.toggle('active', a.getAttribute('href').includes(path));
            });
            syncPlayerUI();
        }
    </script>
</body>
</html>
