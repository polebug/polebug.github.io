    <audio id="global-audio"></audio>
    <div class="floating-audio-pill" id="global-player">
        <div class="visualizer" id="pill-visualizer"><span></span><span></span><span></span></div>
        <div class="pill-track-info"><div class="pill-track-name" id="pill-title">Not Playing</div></div>

    <main class="article-container" id="pjax-container" style="max-width: 1200px; margin: 0 auto; padding: 60px 5%;">
        <h1>思考与生活</h1>

        </ul>
    </main>

    <script>
        const playlist = [
            { title: 'PWLT', artist: 'Krystal', src: '/images/PWLT.mp3' },
            { title: '비행운', artist: 'MoonMoon', src: '/images/飞机云.mp3' },
            { title: '위잉위잉 (WI ING WI ING) ', artist: '혁오 (Hyukoh) ', src: '/images/WIINGWIING.mp3' },
            { title: 'Surf Boy', artist: '혁오 (Hyukoh) ', src: '/images/Surf_boy.mp3' }
        ];
        let currentTrackIdx = 0;
        const audio = document.getElementById('global-audio');

        function initAudio() { audio.src = playlist[currentTrackIdx].src; audio.onended = () => { nextTrack(); }; }
        function syncPlayerUI() {
            const isPlaying = !audio.paused;
            const currentTrack = playlist[currentTrackIdx];
            document.getElementById('pill-title').innerText = currentTrack.title;
            document.getElementById('pill-play-btn').innerText = isPlaying ? '⏸' : '▶';
            document.getElementById('pill-visualizer').classList.toggle('playing', isPlaying);
        }
        function togglePlay() {
            if (!audio.src) initAudio();
            if (audio.paused) audio.play().then(syncPlayerUI).catch(e=>console.log);
            else audio.pause();
            syncPlayerUI();
        }
        function nextTrack() {
            currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
            audio.src = playlist[currentTrackIdx].src;
            audio.play().then(syncPlayerUI).catch(e=>console.log);
            syncPlayerUI();
        }
        document.getElementById('pill-play-btn').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
        document.getElementById('pill-next-btn').addEventListener('click', (e) => { e.stopPropagation(); nextTrack(); });
        initAudio();
        syncPlayerUI();

        // SPA 路由
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link || !link.href || link.getAttribute('target') === '_blank') return;
            if (link.origin !== window.location.origin) return;
            const isStaticAsset = /\.(css|js|png|jpg|jpeg|ico|mp3|wav|xml|txt|json)$/i.test(link.href);
            if (isStaticAsset) return;
            e.preventDefault();
            loadPage(link.href);
        });
        async function loadPage(url, skipPushState = false) {
            document.body.style.cursor = 'wait';
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const html = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const newContent = doc.getElementById('pjax-container');
                if (!newContent) throw new Error();
                const newStyles = doc.querySelectorAll('link[rel="stylesheet"]');
                newStyles.forEach(newLink => {
                    const href = newLink.getAttribute('href');
                    if (!document.querySelector(`link[rel="stylesheet"][href="${href}"]`)) {
                        const linkNode = document.createElement('link');
                        linkNode.rel = 'stylesheet';
                        linkNode.href = href;
                        document.head.appendChild(linkNode);
                    }
                });
                document.getElementById('pjax-container').innerHTML = newContent.innerHTML;
                document.title = doc.title;
                if (!skipPushState) history.pushState(null, null, url);
                window.scrollTo(0, 0);
                if (typeof reRunPageScripts === 'function') reRunPageScripts();
            } catch (err) { window.location.href = url; }
            finally { document.body.style.cursor = 'default'; }
        }
        window.addEventListener('popstate', () => { loadPage(window.location.href, true); });
        function reRunPageScripts() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.vibe-navbar .nav-links a').forEach(a => {
                const aHref = a.getAttribute('href');
                a.classList.toggle('active', currentPath === aHref);
            });
            syncPlayerUI();
        }
        reRunPageScripts();
    </script>
</body>
</html>
