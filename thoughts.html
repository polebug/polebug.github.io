<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思考与生活 | WW.WIKI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* 全局统一核心样式 */
        :root { --bg-color: #fafafc; --text-main: #111111; --text-muted: #666666; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px; color: var(--text-main); line-height: 1.6; overflow-x: hidden;
        }
        
        /* 统一导航栏样式 */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 5vw; background: rgba(250,250,252,0.8);
            backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); text-decoration: none; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a {
            text-decoration: none; color: var(--text-muted);
            font-size: 15px; font-weight: 600; transition: color 0.3s ease;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        
        /* 页面容器 */
        .container { max-width: 900px; margin: 0 auto; padding: 80px 20px; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* 页面头 */
        .page-header { margin-bottom: 50px; }
        .page-header h1 { font-size: 40px; font-weight: 800; margin-bottom: 15px; letter-spacing: -1px; }
        
        /* 文章列表区域 - 保持你原有的结构 */
        .thought-list { display: flex; flex-direction: column; gap: 20px; }
        .thought-item {
            background: #fff; border: 1px solid rgba(0,0,0,0.06); border-radius: 16px;
            padding: 24px; text-decoration: none; display: block;
            transition: all 0.3s ease;
        }
        .thought-item:hover { border-color: #000; transform: translateX(5px); }
        .thought-item h3 { font-size: 18px; font-weight: 700; color: #111; margin-bottom: 4px; }
        .thought-item span { font-size: 14px; color: #888; }
    </style>
    
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">WW.WIKI</a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="projects.html">项目与洞察</a>
            <a href="thoughts.html" class="active">思考与生活</a>
            <a href="about.html">关于我</a>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>思考与生活</h1>
        </header>

        <!-- 这里是你之前的文章列表结构，我已适配新 UI -->

            </a>

                <span>发布日期或摘要信息</span>
            </a>
            
            <!-- 请在此处继续添加你原有的文章列表 -->

    </main>

</body>
</html>
