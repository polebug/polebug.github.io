<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="vibe-navbar">
        <div class="logo">WW.WIKI</div>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="/index.html">首页</a>
            <a href="/projects.html">项目与洞察</a>
            <a href="/thoughts.html" class="active">思考与生活</a>
            <a href="/about.html">关于我</a>
        </div>
    </nav>

    <audio id="global-audio"></audio>
    <div class="floating-audio-pill" id="global-player">
        <div class="visualizer" id="pill-visualizer"><span></span><span></span><span></span></div>
        <div class="pill-track-info"><div class="pill-track-name" id="pill-title">Not Playing</div></div>
        <button class="pill-btn" id="pill-play-btn">▶</button>
        <button class="pill-btn" id="pill-next-btn">⏭</button>
    </div>

    <main class="article-container" id="pjax-container" style="max-width: 800px; margin: 0 auto; padding: 60px 20px;">
        <h1 style="font-size: 36px; font-weight: 800; margin-bottom: 20px;">思考与生活</h1>
        <p style="color: #666; margin-bottom: 40px;">这里是你的思考记录。</p>
        
        <ul style="list-style: none; padding: 0;">
            <li style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                <a href="/2026/0120新加坡3日游记.html" style="font-size: 18px; font-weight: bold; text-decoration: none; color: #111;">新加坡3日游记</a>
                <span style="display: block; font-size: 14px; color: #999; margin-top: 5px;">2026-01-20</span>
            </li>
            <li style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                <a href="/2026/0417vibe-coding初体验.html" style="font-size: 18px; font-weight: bold; text-decoration: none; color: #111;">Vibe Coding初体验</a>
                <span style="display: block; font-size: 14px; color: #999; margin-top: 5px;">2026-04-17</span>
            </li>
            <li style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                <a href="/2026/0522我的第一个博客网站.html" style="font-size: 18px; font-weight: bold; text-decoration: none; color: #111;">我的第一个博客网站</a>
                <span style="display: block; font-size: 14px; color: #999; margin-top: 5px;">2026-05-22</span>
            </li>
        </ul>
    </main>

<script>
        const playlist = [
            { title: 'PWLT', artist: 'Krystal', src: '/images/PWLT.mp3' },
            { title: '비행운', artist: 'MoonMoon', src: '/images/飞机云.mp3' },
            { title: '위잉위잉 (WI ING WI ING) ', artist: '혁오 (Hyukoh) ', src: '/images/WIINGWIING.mp3' },
            { title: 'Surf Boy', artist: '혁오 (Hyukoh) ', src: '/images/Surf_boy.mp3' }
        ];
        let currentTrackIdx = 0;
        const audio = document.getElementById('global-audio');

        function initAudio() {
            audio.src = playlist[currentTrackIdx].src;
            audio.onended = () => { nextTrack(); };
        }

        function syncPlayerUI() {
            const isPlaying = !audio.paused;
            const currentTrack = playlist[currentTrackIdx];

            document.getElementById('pill-title').innerText = currentTrack.title;
            document.getElementById('pill-play-btn').innerText = isPlaying ? '⏸' : '▶';
            document.getElementById('pill-visualizer').classList.toggle('playing', isPlaying);

            const homeTitle = document.getElementById('home-audio-title');
            const homeArtist = document.getElementById('home-audio-artist');
            const homeStatus = document.getElementById('home-player-status');
            const homeVisualizer = document.getElementById('home-visualizer');
            const homeDisc = document.getElementById('home-audio-disc');

            if (homeTitle) {
                homeTitle.innerText = currentTrack.title;
                homeArtist.innerText = currentTrack.artist;
                homeStatus.innerText = isPlaying ? 'Now Playing' : 'Music Paused';
                homeVisualizer.classList.toggle('playing', isPlaying);
                if(homeDisc) homeDisc.style.animationPlayState = isPlaying ? 'running' : 'paused';
                homeTitle.style.color = isPlaying ? '#1a73e8' : '#111115';
            }
        }

        function togglePlay() {
            if (!audio.src) initAudio();
            if (audio.paused) {
                audio.play().then(syncPlayerUI).catch(e => console.log("等待交互:", e));
            } else {
                audio.pause();
                syncPlayerUI();
            }
        }

        function nextTrack() {
            currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
            audio.src = playlist[currentTrackIdx].src;
            audio.play().then(syncPlayerUI).catch(e => console.log("切换歌曲自启失败:", e));
            syncPlayerUI();
        }

        document.getElementById('pill-play-btn').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
        document.getElementById('pill-next-btn').addEventListener('click', (e) => { e.stopPropagation(); nextTrack(); });
        initAudio();
        syncPlayerUI();

        // 🚀 SPA 终极路由拦截器
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link || !link.href || link.getAttribute('target') === '_blank') return;
            if (link.origin !== window.location.origin) return;
            
            // 【过滤】放行跨域链接和所有静态资源（包含 .json）
            const isStaticAsset = /\.(css|js|png|jpg|jpeg|ico|mp3|wav|xml|txt|json)$/i.test(link.href);
            if (isStaticAsset) return;

            e.preventDefault();
            loadPage(link.href);
        });

        async function loadPage(url, skipPushState = false) {
            document.body.style.cursor = 'wait';
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("HTTP Status " + res.status);
                const html = await res.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const newContent = doc.getElementById('pjax-container');
                if (!newContent) throw new Error("页面缺少 pjax-container 容器");

                // --- 核心修复：动态加载目标页面的 CSS，彻底解决样式丢失 ---
                const newStyles = doc.querySelectorAll('link[rel="stylesheet"]');
                newStyles.forEach(newLink => {
                    const href = newLink.getAttribute('href');
                    if (!document.querySelector(`link[rel="stylesheet"][href="${href}"]`)) {
                        const linkNode = document.createElement('link');
                        linkNode.rel = 'stylesheet';
                        linkNode.href = href;
                        document.head.appendChild(linkNode);
                    }
                });

                document.getElementById('pjax-container').innerHTML = newContent.innerHTML;
                document.title = doc.title;

                if (!skipPushState) history.pushState(null, null, url);
                window.scrollTo(0, 0);
                if (typeof reRunPageScripts === 'function') reRunPageScripts();
                
            } catch (err) {
                console.warn("异步加载失败，回退至原生跳转:", err);
                window.location.href = url; // 终极兜底：报错就硬刷新，绝不卡死
            } finally {
                document.body.style.cursor = 'default';
            }
        }

        window.addEventListener('popstate', () => { loadPage(window.location.href, true); });

        // 3. 🔄 页面专属脚本激活中心
        function reRunPageScripts() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.vibe-navbar .nav-links a').forEach(a => {
                const aHref = a.getAttribute('href');
                if (currentPath === aHref || (currentPath === '/' && aHref === '/index.html')) {
                    a.classList.add('active');
                } else {
                    a.classList.remove('active');
                }
            });

            const mobileMenu = document.getElementById('mobile-menu');
            const navLinks = document.getElementById('nav-links');
            if (mobileMenu && navLinks) {
                mobileMenu.onclick = null;
                mobileMenu.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                    mobileMenu.classList.toggle('open');
                });
            }

            const homeCard = document.getElementById('home-music-widget');
            if (homeCard) {
                homeCard.addEventListener('click', togglePlay);
                const insights = ['"最敏锐的商业机会，往往藏在用户的原声数据里。"', '"跳出传统的问卷框架，去聆听真实世界的声音。"', '"适老化改造，不仅是硬件升级，更是尊严的重塑。"'];
                let idx = 0;
                const insightBox = document.getElementById('insight-box');
                if(insightBox) {
                    insightBox.onclick = null;
                    insightBox.addEventListener('click', () => {
                        idx = (idx + 1) % insights.length;
                        insightBox.innerText = insights[idx];
                    });
                }
                let count = 108;
                const likeBtn = document.getElementById('like-btn');
                if(likeBtn) {
                    likeBtn.onclick = null;
                    likeBtn.addEventListener('click', () => {
                        const countEl = document.getElementById('like-count');
                        if (countEl) countEl.innerText = ++count;
                    });
                }
            }
            syncPlayerUI();
        }

        function updateClock() {
            const clockEl = document.getElementById('clock');
            if (clockEl) {
                const options = { timeZone: 'Asia/Singapore', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
                clockEl.innerText = new Date().toLocaleTimeString('zh-CN', options);
            }
        }
        if (!window.clockIntervalId) window.clockIntervalId = setInterval(updateClock, 1000);
        reRunPageScripts();
    </script>
</body>
</html>
