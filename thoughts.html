    <!-- 请注意：可以直接把上文 index.html 底部的 <script>...</script> 标签整个原样拷贝到此处，保持各页面脚本一致，多余的函数在没有对应ID时会自动跳过。为了精简我省略了重复展示。 -->
    <script>
        const currentPath = window.location.pathname;
        document.querySelectorAll('.vibe-navbar .nav-links a').forEach(a => {
            if (currentPath === a.getAttribute('href') || (currentPath === '/' && a.getAttribute('href') === '/index.html')) {
                a.classList.add('active');
            } else {
                a.classList.remove('active');
            }
        });
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        if (mobileMenu && navLinks) {
            mobileMenu.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                mobileMenu.classList.toggle('open');
            });
        }
    </script>
