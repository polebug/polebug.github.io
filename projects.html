<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目与洞察 | WW.WIKI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="vibe-navbar">
        <div class="logo">WW.WIKI</div>
        <div class="nav-links">
            <a href="/index.html">首页</a>
            <a href="/projects.html" class="active">项目与洞察</a>
            <a href="/thoughts.html">思考与生活</a>
            <a href="/about.html">关于我</a>
        </div>
    </nav>

    <audio id="global-audio" preload="auto"></audio>
    <div class="floating-audio-pill" id="global-player">
        <div class="visualizer" id="pill-visualizer"><span></span><span></span><span></span></div>
        <div class="pill-track-info"><div class="pill-track-name" id="pill-title">Not Playing</div></div>
        <button class="pill-btn" id="pill-play-btn">▶</button>
        <button class="pill-btn" id="pill-next-btn">⏭</button>
    </div>

    <main style="max-width: 1200px; margin: 0 auto; padding: 60px 5%;">
        <h1>项目与洞察</h1>
        <p style="color: #666; margin-bottom: 40px;">硬核内容、技术笔记、行业研究报告。</p>
        <div style="background: #f5f5f7; padding: 40px; border-radius: 24px; text-align: center; color: #888;">
            🚀 调研工坊待办中 —— 项目卡片与洞察报告模块正在整理装配。
        </div>
    </main>

    <script>
        const playlist = [
            { title: 'PWLT', artist: 'Krystal', src: '/images/PWLT.mp3' },
            { title: '비행운', artist: 'MoonMoon', src: '/images/飞机云.mp3' },
            { title: '위잉위잉', artist: 'Hyukoh', src: '/images/WIINGWIING.mp3' },
            { title: 'Surf Boy', artist: 'Hyukoh', src: '/images/Surf_boy.mp3' }
        ];
        let currentTrackIdx = 0;
        const audio = document.getElementById('global-audio');

        function initAudio() { audio.src = playlist[currentTrackIdx].src; audio.onended = () => { nextTrack(); }; }
        function syncPlayerUI() {
            const isPlaying = !audio.paused;
            const currentTrack = playlist[currentTrackIdx];
            document.getElementById('pill-title').innerText = currentTrack.title;
            document.getElementById('pill-play-btn').innerText = isPlaying ? '⏸' : '▶';
            document.getElementById('pill-visualizer').classList.toggle('playing', isPlaying);
        }
        function togglePlay() {
            if (!audio.src) initAudio();
            if (audio.paused) audio.play().then(syncPlayerUI).catch(e=>console.log);
            else audio.pause();
            syncPlayerUI();
        }
        function nextTrack() {
            currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
            audio.src = playlist[currentTrackIdx].src;
            audio.play().then(syncPlayerUI).catch(e=>console.log);
            syncPlayerUI();
        }
        document.getElementById('pill-play-btn').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
        document.getElementById('pill-next-btn').addEventListener('click', (e) => { e.stopPropagation(); nextTrack(); });
        initAudio();
        syncPlayerUI();
    </script>
</body>
</html>
