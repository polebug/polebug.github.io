# Builds blog/ and publishes it to GitHub Pages (blog.polebug.com) on every push to main that touches it.
name: Blog

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/blog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_GITALK_CLIENT_SECRET: ${{ secrets.GITALK_CLIENT_SECRET }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blog/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
