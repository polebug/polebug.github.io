<script src="/js/jquery-3.1.0.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script>
    // 音乐播放器逻辑
    const playlist = [
        { title: 'PWLT', src: '/images/PWLT.mp3' },
        { title: '비행운', src: '/images/飞机云.mp3' }
    ];
    let currentIdx = 0;
    const audio = document.getElementById('global-audio');
    
    // SPA 拦截逻辑 (确保不拦截静态资源)
    document.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        // 如果没有链接，或者链接是新窗口打开，直接跳过拦截
        if (!link || !link.href || link.getAttribute('target') === '_blank') return;
        
        // 【添加这行】过滤：如果是静态资源，直接放行，不要拦截！
        const isStaticAsset = /\.(css|js|png|jpg|ico|mp3|wav|xml|txt)$/.test(link.href);
        
        // 只有在是站内链接 且 不是静态资源时，才执行 PJAX 拦截
        if (link.origin === window.location.origin && !isStaticAsset) {
            e.preventDefault();
            loadPage(link.href);
        }
    });

    async function loadPage(url) {
        const res = await fetch(url);
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const container = doc.getElementById('pjax-container');
        if (container) {
            document.getElementById('pjax-container').innerHTML = container.innerHTML;
            document.title = doc.title;
            history.pushState(null, null, url);
            window.scrollTo(0, 0);
        } else {
            window.location.href = url;
        }
    }
</script>
</body>
