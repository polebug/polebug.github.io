<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章标题 | WW.WIKI</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="vibe-navbar">
        <div class="logo">WW.WIKI</div>
        <div class="nav-links">
            <a href="/index.html">首页</a>
            <a href="/projects.html">项目与洞察</a>
            <a href="/thoughts.html">思考与生活</a>
            <a href="/about.html">关于我</a>
        </div>
    </nav>

    <audio id="global-audio"></audio>
    <div class="floating-audio-pill" id="global-player">
        <div class="visualizer" id="pill-visualizer"><span></span><span></span><span></span></div>
        <div class="pill-track-info"><div class="pill-track-name" id="pill-title">Loading...</div></div>
        <button class="pill-btn" id="pill-play-btn">▶</button>
        <button class="pill-btn" id="pill-next-btn">⏭</button>
    </div>

    <main class="article-container" id="pjax-container">
        <a href="/thoughts.html" class="article-back">← 返回思考与生活</a>
        <article>
            <header class="article-header">
                <h1 class="article-title">这里填标题</h1>
                <div class="article-meta">
                    <span>📅 2026-06-07</span>
                </div>
            </header>
            <div class="article-content">
                <p>这里开始你的正文...</p>
            </div>
        </article>
    </main>

    <script>
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link || !link.href || link.getAttribute('target') === '_blank') return;
            const isStatic = /\.(css|js|png|jpg|ico|mp3|wav)$/.test(link.href);
            if (link.origin === window.location.origin && !isStatic) {
                e.preventDefault();
                loadPage(link.href);
            }
        });

        async function loadPage(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                document.getElementById('pjax-container').innerHTML = doc.getElementById('pjax-container').innerHTML;
                document.title = doc.title;
                history.pushState(null, null, url);
                window.scrollTo(0, 0);
                // 触发必要组件重载
                if(typeof reRunPageScripts === 'function') reRunPageScripts();
            } catch (err) { window.location.href = url; }
        }
    </script>
</body>
</html>
